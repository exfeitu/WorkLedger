name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

# Manual redeploy marker: 2026-09-12

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # 曾用 "pages"；GitHub 故障期间产生了一个 run 级状态卡死在 waiting 的僵尸运行，
  # 永久占住旧并发组，导致组内新运行全部排队。改名绕开该僵尸运行。
  group: "pages-deploy"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Check architecture boundaries
        run: npm run check:architecture

      - name: Run type check
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Build static site
        run: npm run build
        env:
          SITE_BASE_PATH: ${{ github.event.repository.name == 'LittleJobHelper' && '/LittleJobHelper' || '/WorkLedger' }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
